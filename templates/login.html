{% extends "base.html" %}
{% block content %}
<div class="auth-box">
  <h1>Login</h1>
  <form method="post">
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn btn-large">Login</button>
  </form>
  <p>No account? <a href="{{ url_for('register') }}">Register here</a></p>
  <p class="hint">Demo: <b>user@store.com</b> / <b>user123</b></p>
</div>
{% endblock %}
