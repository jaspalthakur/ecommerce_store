{% extends "base.html" %}
{% block content %}
<div class="empty-state" style="padding: 80px 20px;">
  <div class="empty-icon">{{ '🔒' if code == 403 else '🔍' }}</div>
  <h1 style="font-size: 3rem; margin-bottom: 8px; color: var(--primary);">{{ code }}</h1>
  <h2>{{ msg }}</h2>
  <p style="margin: 16px 0 24px; color: var(--text-muted);">
    {{ 'You do not have administrative privileges to view this page.' if code == 403 else 'The page you requested could not be found.' }}
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-hero">Return to ShopEasy Home</a>
</div>
{% endblock %}
