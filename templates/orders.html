{% extends "base.html" %}
{% block content %}
<h1>My Orders</h1>
{% if orders %}
<table class="cart-table">
  <thead><tr><th>#</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead>
  <tbody>
    {% for o in orders %}
    <tr>
      <td>#{{ o.id }}</td>
      <td>{{ o.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
      <td>${{ '%.2f'|format(o.total) }}</td>
      <td><span class="badge badge-{{ o.status }}">{{ o.status }}</span></td>
      <td><a href="{{ url_for('order_detail', oid=o.id) }}">View</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
  <p class="empty">No orders yet.</p>
{% endif %}
{% endblock %}
