{% extends "base.html" %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">✨</div>
      <h2>Create Your Account</h2>
      <p>Join ShopEasy to save items, track orders, and get 10% off your first purchase</p>
    </div>

    <form method="post" class="auth-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password (6+ characters)</label>
        <input type="password" id="password" name="password" minlength="6" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-hero w-100">Create Free Account</button>
    </form>

    <div class="auth-footer-links">
      <p>Already have an account? <a href="{{ url_for('login') }}">Sign in here</a></p>
    </div>
  </div>
</div>

{% endblock %}
